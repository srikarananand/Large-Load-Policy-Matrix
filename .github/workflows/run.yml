name: Build the large-load policy matrix

# Downloads the public PDFs, extracts the matrix with Groq, verifies every quote against its page,
# then rebuilds docs/index.html and commits the results.
# Needs the repository secret GROQ_API_KEY.
on:
  workflow_dispatch:
    inputs:
      docs:
        description: "'all' or space-separated document ids from largeload/sources.yaml"
        default: all
permissions:
  contents: write
concurrency:
  group: build
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt
      - run: python -m pytest -q tests
      - uses: actions/cache@v4
        with: {path: .cache, key: pdfs-v1}
      - name: Extract and verify
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python -m largeload.run --docs "${{ inputs.docs }}"
      - run: python -m largeload.faults
      - run: python -m largeload.report
      - name: Commit results
        run: |
          git config user.name "Srikaran Anand"
          git config user.email "fsrikar@okstate.edu"
          git add outputs docs
          git diff --cached --quiet || git commit -m "Refresh policy matrix results"
          git push
